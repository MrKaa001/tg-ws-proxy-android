plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

// Release signing — secrets live in keystore.properties at the project root (gitignored).
// Missing file is fine for debug builds; release just falls back to unsigned then.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// Self-update via GitHub Releases: repo coords + embedded read-only PAT.
// Lives in update.properties (gitignored) — see update.properties.example.
// Missing file → empty BuildConfig fields → the in-app update section hides itself.
def updatePropsFile = rootProject.file("update.properties")
def updateProps = new Properties()
if (updatePropsFile.exists()) {
    updateProps.load(new FileInputStream(updatePropsFile))
}
def updateProp = { key -> (updateProps.getProperty(key) ?: "").replace("\"", "\\\"") }

android {
    namespace 'com.mrkaa.tgwsproxy'
    compileSdk 34

    defaultConfig {
        applicationId "com.mrkaa.tgwsproxy"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "0.6.2"
        // Header "vX.Y.Z" tag derives from versionName — no per-locale hardcoded copies
        // (they drifted: values had v0.2.0, values-ru still v0.1.0). Debug builds get
        // "v0.3.0-debug" via versionNameSuffix automatically.
        resValue "string", "version_tag", "v${versionName}"

        buildConfigField "String", "UPDATE_OWNER", "\"${updateProp('github.owner')}\""
        buildConfigField "String", "UPDATE_REPO", "\"${updateProp('github.repo')}\""
        buildConfigField "String", "UPDATE_TOKEN", "\"${updateProp('github.token')}\""

        ndk {
            // Real phones only. x86_64 (emulator) dropped so we don't need a 2nd set of
            // native wheels — add it back (+ its wheels in wheels/) if emulator testing is needed.
            abiFilters "arm64-v8a"
        }

        // Chaquopy: embed CPython + the upstream proxy + cryptography (prebuilt wheel).
        // Target 3.11 because that's what buildPython on this machine is (3.11.1)
        // and it's the minimum the upstream proxy needs (asyncio low-level sockets).
        python {
            version "3.11"
            // buildPython must match the target minor version (3.11). Auto-detected from
            // PATH; pinned here because this machine's python lives in a non-standard dir.
            buildPython "C:/Soft/Python/Python311/python.exe"
            pip {
                // AES-CTR for MTProto. Upstream has a ctypes/libcrypto fallback, but
                // Android has no loadable libcrypto.so by name, so the wheel is required.
                // Pinned to the versions Chaquopy ships for cp311/arm64.
                install "cryptography==42.0.8"
                install "cffi==1.17.1"
                // TLS root certificates — upstream imports certifi at module level since
                // v1.10.4 (ssl.create_default_context(cafile=certifi.where())). Pure-python
                // wheel, prefetched into wheels/ for offline/DPI-throttled builds.
                install "certifi"
                // chaquo.com throttles large wheel bodies from here (DPI), so the native
                // wheels are pre-fetched (chunked) into wheels/ and served via --find-links.
                // Small index metadata still loads fine from the normal indexes.
                options "--find-links", "${rootDir}/wheels", "--timeout", "180", "--retries", "10"
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // Versioned APK names so shared/release files never collide:
            // tg-ws-proxy-0.3.0.apk (release), tg-ws-proxy-0.3.0-debug.apk (debug).
            outputFileName = "tg-ws-proxy-${variant.versionName}.apk"
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // Sign with the release key when keystore.properties is present; otherwise
            // assembleRelease produces an unsigned APK (CI/contributor without the key).
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        // AGP 8 defaults this to off; Updater.kt reads BuildConfig.
        buildConfig true
    }
}

// Python sources live in the default Chaquopy dir: src/main/python/
// (proxy_entry.py + the fetched proxy/ from upstream — see tools/fetch_upstream.*)

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
